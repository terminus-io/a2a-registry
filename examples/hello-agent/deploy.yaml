---
apiVersion: v1
kind: Namespace
metadata:
  name: a2a-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-agent
  namespace: a2a-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-agent
  template:
    metadata:
      labels:
        app: hello-agent
    spec:
      containers:
        - name: agent
          image: 10.29.15.63/hello-agent:v0.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 9001
          env:
            - name: AGENT_NAME
              value: "Hello Agent"
            - name: AGENT_DESC
              value: "A demo A2A agent running on Kubernetes"
            - name: AGENT_SKILL_ID
              value: "hello"
          livenessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: 9001
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: 9001
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hello-agent
  namespace: a2a-demo
spec:
  selector:
    app: hello-agent
  ports:
    - port: 9001
      targetPort: 9001
---
apiVersion: a2a.io/v1
kind: A2AAgent
metadata:
  name: hello-agent
  namespace: a2a-demo
spec:
  name: "Hello Agent"
  description: "A demo A2A agent running on Kubernetes"
  version: "1.0.0"
  url: "http://hello-agent.a2a-demo.svc.cluster.local:9001"
  capabilities:
    streaming: false
  skills:
    - id: "hello"
      name: "Hello"
      description: "Responds to greetings and simple messages"
      tags:
        - "demo"
        - "hello"
  defaultInputModes:
    - "text"
  defaultOutputModes:
    - "text"
  protocolVersion: "1.0"
  tags:
    - "demo"
    - "hello"
    - "example"
  enabled: true
  healthCheck:
    intervalSeconds: 30
    timeoutSeconds: 10
