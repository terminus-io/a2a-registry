apiVersion: v1
kind: Service
metadata:
  name: {{ include "a2a-registry.fullname" . }}
  namespace: {{ include "a2a-registry.namespace" . }}
  labels:
    {{- include "a2a-registry.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "a2a-registry.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.metrics.port }}
      targetPort: metrics
      protocol: TCP
    - name: health
      port: {{ .Values.service.health.port }}
      targetPort: health
      protocol: TCP
    - name: registry-api
      port: {{ .Values.service.registryAPI.port }}
      targetPort: registry-api
      protocol: TCP
